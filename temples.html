<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Temple Album - A responsive gallery showcasing beautiful temples around the world.">
  <meta name="author" content="Ronald Kabanda">
  <title>Temple Album </title>
  
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/temples.css">
  <link rel="stylesheet" href="styles/temples-large.css" media="screen and (min-width: 768px)">
  

  <script src="scripts/temples.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <span>Temple Album</span>
      </div>
      
      <button class="hamburger-btn" id="hamburgerBtn" aria-label="Menu" aria-expanded="false">☰</button>
      
     
      <nav class="main-nav" id="mainNav">
        <ul class="nav-menu">
          <li><a href="#" class="nav-link">Home</a></li>
          <li><a href="#" class="nav-link">Old</a></li>
          <li><a href="#" class="nav-link">New</a></li>
          <li><a href="#" class="nav-link">Large</a></li>
          <li><a href="#" class="nav-link">Small</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="main-content">
    <h1 class="page-title">Home</h1>
    
    <div class="temple-grid">
   
      <figure class="temple-card">
        <img src="images/salt-ake-temple.webp" alt="Salt Lake Temple">
        <figcaption>Salt Lake Temple, Utah</figcaption>
      </figure>
      
      <figure class="temple-card">
        <img src="images/st-george-tah-emple.webp" alt="St. George Utah Temple">
        <figcaption>St. George Utah Temple</figcaption>
      </figure>
      
      <figure class="temple-card">
        <img src="images/manti-tah-temple.webp" alt="Manti Utah Temple">
        <figcaption>Manti Utah Temple</figcaption>
      </figure>
      
      <figure class="temple-card">
        <img src="images/logan-utah-temple.webp" alt="Logan Utah Temple">
        <figcaption>Logan Utah Temple</figcaption>
      </figure>
      
      <figure class="temple-card">
        <img src="images/laie-hawai-temple.webp" alt="Laie Hawaii Temple">
        <figcaption>Laie Hawaii Temple</figcaption>
      </figure>
      
      <figure class="temple-card">
        <img src="images/cardston_alberta-temple.jpeg" alt="Cardston Alberta Temple">
        <figcaption>Cardston Alberta Temple</figcaption>
      </figure>
      
      <figure class="temple-card">
        <img src="images/mesa-anzona-temple.webp" alt="Mesa Arizona Temple">
        <figcaption>Mesa Arizona Temple</figcaption>
      </figure>
      
      <figure class="temple-card">
        <img src="images/nauvoo-lllionois-temple.jpg" alt="Nauvoo Illinois Temple">
        <figcaption>Nauvoo Illinois Temple</figcaption>
      </figure>

      <figure class="temple-card">
        <img src="images/san-diego-temple.webp" alt="San Diego Temple">
        <figcaption>San Diego Temple</figcaption>
      </figure>

      <figure class="temple-card">
        <img src="images/accra-ghana-temple.webp" alt="Accra Ghana Temple">
        <figcaption>Accra Ghana Temple</figcaption>
      </figure>

      <figure class="temple-card">
        <img src="images/cape-town-temple.webp" alt="Cape Town South Africa Temple">
        <figcaption>Cape Town South Africa Temple</figcaption>
      </figure>
      
      <figure class="temple-card">
        <img src="images/washington-d.c-temple.png" alt="Washington D.C. Temple">
        <figcaption>Washington D.C. Temple</figcaption>
      </figure>
    </div>
  </main>

  <footer class="site-footer">
  <div class="footer-container">
    <p>&copy; 2024 ❤️ Ronald Kabanda ❤️ Uganda ❤️</p>

  </div>
</footer>

</html>
